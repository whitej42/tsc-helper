name: Infra (Terraform)

# Provisions the S3 + CloudFront hero-asset stack in infra/.
# Everything is driven by environment variables / secrets — no account-specific
# values are committed. On PRs it runs a plan; on push to main it applies.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for GitHub OIDC -> AWS role assumption

defaults:
  run:
    shell: bash
    working-directory: infra

env:
  # --- AWS auth (via OIDC role assumption — no static keys) ---
  # Falls back to eu-west-2 if the AWS_REGION repo variable isn't set.
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}

  # --- Remote state backend (set as repo/environment variables) ---
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
  TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
  TF_BACKEND_DYNAMODB_TABLE: ${{ vars.TF_BACKEND_DYNAMODB_TABLE }}

  # --- Terraform input variables (TF_VAR_* maps to var.* automatically) ---
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-2' }}
  TF_VAR_project: ${{ vars.TF_VAR_PROJECT }}
  TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT }}
  TF_VAR_bucket_name: ${{ vars.TF_VAR_BUCKET_NAME }}
  TF_VAR_price_class: ${{ vars.TF_VAR_PRICE_CLASS }}
  TF_VAR_domain_aliases: ${{ vars.TF_VAR_DOMAIN_ALIASES }}
  TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
  TF_VAR_create_certificate: ${{ vars.TF_VAR_CREATE_CERTIFICATE }}
  TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    concurrency:
      group: infra-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tsc-tools-infra

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan
